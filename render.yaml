# Render blueprint for the Mizan API. The web app is deployed separately on Vercel (root: apps/web).
services:
  - type: web
    name: mizan-api
    runtime: docker
    region: frankfurt # same region as the Neon database (aws eu-central-1)
    # Paths are relative to the repository root.
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    buildFilter:
      paths:
        - services/api/**
    healthCheckPath: /health
    # The live link must stay up through judging (until 2026-10-22). The free plan sleeps when idle.
    plan: 0.5c-512mb # smallest always-on paid plan (the old "starter")
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MIZAN_INTERNAL_API_KEY
        sync: false
      - key: MIZAN_DATABASE_URL
        sync: false
      - key: MIZAN_CORPUS_VERSION
        value: "2026-10-05.2" # approved sources + labelled supplementary hadith-api
      - key: MIZAN_LLM_MODEL
        value: claude-sonnet-5-5
